kind: pipeline
name: cann

platform:
  os: linux
  arch: arm64

trigger:
  branch:
    - release-cann

volumes:
  - name: docker
    host:
      path: /var/run/docker.sock

workspace:
  path: /go/src/github.com/open-beagle/gpustack

clone:
  disable: true

steps:
  - name: s3-cache
    image: registry.cn-qingdao.aliyuncs.com/wod/devops-s3-cache:1.0
    settings:
      restore: true
      mount:
        - ./.git
      endpoint: https://cache.ali.wodcloud.com
      access_key:
        from_secret: S3_ACCESS_KEY_ALIYUN
      secret_key:
        from_secret: S3_SECRET_KEY_ALIYUN

  - name: fetch
    image: registry.cn-qingdao.aliyuncs.com/wod/devops-git:1.0
    settings:
      proxy:
        from_secret: SOCKS5_PROXY

  - name: python
    image: registry.cn-qingdao.aliyuncs.com/wod/python:3.11
    environment:
      VERSION: v0.7.5
      UI_VERSION: v0.7.5
    commands:
      - bash .beagle/build.sh

  - name: docker-cann-910b
    image: registry.cn-qingdao.aliyuncs.com/wod/devops-docker:1.0
    pull: always
    volumes:
      - name: docker
        path: /var/run/docker.sock
    settings:
      base: registry.cn-qingdao.aliyuncs.com/wod/cann:8.5.1-910b-ubuntu22.04-py3.11
      dockerfile: .beagle/cann.dockerfile
      repo: wod/windstack
      version: "v0.7.5-cann-910b"
      args: "TARGETOS=linux,TARGETARCH=arm64"
      registry: registry.cn-qingdao.aliyuncs.com
      registry_user:
        from_secret: REGISTRY_USER_ALIYUN
      registry_password:
        from_secret: REGISTRY_PASSWORD_ALIYUN

  - name: tag-cann
    image: registry.cn-qingdao.aliyuncs.com/wod/devops-docker-tag:1.0
    settings:
      source: registry.cn-qingdao.aliyuncs.com/wod/windstack:v0.7.5-cann-910b
      target: registry.cn-qingdao.aliyuncs.com/wod/windstack:v0.7.5-cann
      registry: registry.cn-qingdao.aliyuncs.com
      registry_user:
        from_secret: REGISTRY_USER_ALIYUN
      registry_password:
        from_secret: REGISTRY_PASSWORD_ALIYUN

  - name: docker-cann-310p
    image: registry.cn-qingdao.aliyuncs.com/wod/devops-docker:1.0
    pull: always
    volumes:
      - name: docker
        path: /var/run/docker.sock
    settings:
      base: registry.cn-qingdao.aliyuncs.com/wod/cann:8.5.1-310p-ubuntu22.04-py3.11
      dockerfile: .beagle/cann.dockerfile
      repo: wod/windstack
      version: "v0.7.5-cann-310p"
      args: "TARGETOS=linux,TARGETARCH=arm64"
      registry: registry.cn-qingdao.aliyuncs.com
      registry_user:
        from_secret: REGISTRY_USER_ALIYUN
      registry_password:
        from_secret: REGISTRY_PASSWORD_ALIYUN

