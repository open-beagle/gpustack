kind: pipeline
name: cuda

trigger:
  branch:
    - release-cuda
  event:
    - push

volumes:
  - name: docker
    host:
      path: /var/run/docker.sock

workspace:
  path: /go/src/github.com/open-beagle/gpustack

clone:
  disable: true

steps:
  - name: s3-cache
    image: registry-vpc.cn-qingdao.aliyuncs.com/wod/devops-s3-cache:1.0
    settings:
      restore: true
      mount:
        - ./.git
      endpoint: https://cache.ali.wodcloud.com
      access_key:
        from_secret: S3_ACCESS_KEY_ALIYUN
      secret_key:
        from_secret: S3_SECRET_KEY_ALIYUN

  - name: fetch
    image: registry-vpc.cn-qingdao.aliyuncs.com/wod/devops-git:1.0
    settings:
      proxy:
        from_secret: SOCKS5_PROXY

  - name: python
    image: registry-vpc.cn-qingdao.aliyuncs.com/wod/python:3.10-bookworm
    environment:
      VERSION: v0.7.5
      UI_VERSION: v0.7.5
      BUILD_RUNTIME_ASSETS: "auto"
    commands:
      - bash .beagle/build.sh

  # Nvidia runtime base. The step is present on every release-cuda build, but
  # the script exits before invoking the docker plugin unless runtime inputs changed.
  - name: docker-cuda-base
    image: registry-vpc.cn-qingdao.aliyuncs.com/wod/devops-docker:1.0
    volumes:
      - name: docker
        path: /var/run/docker.sock
    commands:
      - |
        if ! .beagle/should-build-cuda-base.sh; then
          echo "CUDA runtime base inputs unchanged, skipping windstackbase build."
          exit 0
        fi
        /opt/bin/devops-docker
    settings:
      base: registry-vpc.cn-qingdao.aliyuncs.com/wod/cuda:12.8.1-runtime-ubuntu22.04
      dockerfile: .beagle/cuda-base.dockerfile
      repo: wod/windstackbase
      version: "cuda12.8.1-py3.10-vllm0.22.1-omni0.22.0"
      args: "TARGETOS=linux,TARGETARCH=amd64"
      registry: registry-vpc.cn-qingdao.aliyuncs.com
      registry_user:
        from_secret: REGISTRY_USER_ALIYUN
      registry_password:
        from_secret: REGISTRY_PASSWORD_ALIYUN

  # Nvidia
  - name: docker-cuda
    image: registry-vpc.cn-qingdao.aliyuncs.com/wod/devops-docker:1.0
    volumes:
      - name: docker
        path: /var/run/docker.sock
    settings:
      base: registry-vpc.cn-qingdao.aliyuncs.com/wod/windstackbase:cuda12.8.1-py3.10-vllm0.22.1-omni0.22.0
      dockerfile: .beagle/cuda.dockerfile
      repo: wod/windstack
      version: "v0.7.5-cuda"
      args: "TARGETOS=linux,TARGETARCH=amd64"
      registry: registry-vpc.cn-qingdao.aliyuncs.com
      registry_user:
        from_secret: REGISTRY_USER_ALIYUN
      registry_password:
        from_secret: REGISTRY_PASSWORD_ALIYUN

