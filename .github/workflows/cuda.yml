name: cuda-12.4.1

on:
  push:
    branches:
      - dev-v0.7.0

jobs:
  windstack:
    runs-on: ubuntu-latest

    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-docker-images: 'true'

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Aliyun Container Registry
        uses: docker/login-action@v3
        with:
          registry: registry.cn-qingdao.aliyuncs.com
          username: ${{ secrets.REGISTRY_USER_ALIYUN }}
          password: ${{ secrets.REGISTRY_PASSWORD_ALIYUN }}

      - name: Apply v0.7.0-s3 project patch
        run: git apply .beagle/v0.7.0-s3-project.patch

      - name: Build and push CUDA Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            registry.cn-qingdao.aliyuncs.com/wod/windstack:v0.7.0-cuda-raw
          platforms: linux/amd64
          build-args: |
            CUDA_VERSION=12.8.1

      - name: Image push success
        run: echo "Docker images and manifests pushed successfully to registry.cn-qingdao.aliyuncs.com/wod/windstack"
