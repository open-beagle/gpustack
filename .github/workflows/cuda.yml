name: cuda-12.4.1

on:
  push:
    branches:
      - dev-v0.7.0

jobs:
  golang-alpine:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Aliyun Container Registry
        uses: docker/login-action@v2
        with:
          registry: registry.cn-qingdao.aliyuncs.com
          username: ${{ secrets.REGISTRY_USER_ALIYUN }}
          password: ${{ secrets.REGISTRY_PASSWORD_ALIYUN }}

      - name: Cross Build
        run: |
          docker run --rm -v ${{ github.workspace }}:/go/src/github.com/open-beagle/gpustack \
            -w /go/src/github.com/open-beagle/gpustack \
            ghcr.io/${{ github.repository_owner }}/golang:1.24-alpine \
            bash -c "git apply .beagle/v0.7.0-s3-project.patch"

      - name: Build and push CUDA Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            registry.cn-qingdao.aliyuncs.com/wod/windstack:v0.7.0-cuda-raw
          platforms: linux/amd64

      - name: Image push success
        run: echo "Docker images and manifests pushed successfully to registry.cn-qingdao.aliyuncs.com/wod/windstack"
