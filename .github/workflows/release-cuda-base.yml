name: release-cuda-base

on:
  push:
    branches:
      - release-cuda-base
  workflow_dispatch:

env:
  RUNTIME_IMG: ghcr.io/${{ github.repository_owner }}/gpustack
  RUNTIME_TAG: "cuda12.8.2-vllm0.24.0-omni0.24.0"
  BASE_IMG: nvidia/cuda:12.8.2-runtime-ubuntu22.04

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write

    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo docker image prune --all --force

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Build Python package
        env:
          VERSION: "v0.7.6"
          UI_VERSION: "v0.7.6"
        run: bash .beagle/build.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push CUDA runtime base
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./.beagle/cuda-base.dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ env.RUNTIME_IMG }}:${{ env.RUNTIME_TAG }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: |
            BASE=${{ env.BASE_IMG }}
            VERSION=${{ env.RUNTIME_TAG }}

      - name: Image build success
        run: echo "${{ env.RUNTIME_IMG }}:${{ env.RUNTIME_TAG }} built and pushed successfully."
