name: release-cuda-base

on:
  push:
    branches:
      - release-cuda-base
  workflow_dispatch:

env:
  CUDA_VERSION: "13.0.3"
  RUNTIME_IMG: ghcr.io/${{ github.repository_owner }}/gpustack
  RUNTIME_TAG: "cuda13.0.3-vllm0.26.0-omni0.26.0"
  BASE_IMG: nvidia/cuda:13.0.3-runtime-ubuntu24.04

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write

    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo docker image prune --all --force

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Build Python package
        env:
          VERSION: "v0.7.8"
          UI_VERSION: "v0.7.8"
        run: bash .beagle/build.sh

      - name: Download CUDA llama.cpp package
        run: |
          mkdir -p dist
          . .beagle/llama.cpp.lock
          echo "Downloading ${LLAMA_CPP_PACKAGE}.tar.gz..."
          curl -fsSL "https://cache.ali.wodcloud.com/vscode/gpustack/llama.cpp/${LLAMA_CPP_PACKAGE}.tar.gz" -o dist/llama.cpp.tar.gz
          ls -lh dist/llama.cpp.tar.gz

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push CUDA runtime base
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./.beagle/cuda-base.dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ env.RUNTIME_IMG }}:${{ env.RUNTIME_TAG }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: |
            BASE=${{ env.BASE_IMG }}
            VERSION=${{ env.RUNTIME_TAG }}
            CUDA_VERSION=${{ env.CUDA_VERSION }}

      - name: Image build success
        run: echo "${{ env.RUNTIME_IMG }}:${{ env.RUNTIME_TAG }} built and pushed successfully."
