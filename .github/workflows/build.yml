name: Build corex Docker image

on:
  push:
    branches:
    - "dev-v0.7.0"

jobs:
  build-corex:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run build
        run: bash .beagle/build.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Aliyun Container Registry
        uses: docker/login-action@v2
        with:
          registry: registry.cn-qingdao.aliyuncs.com
          username: ${{ secrets.REGISTRY_USER_ALIYUN }}
          password: ${{ secrets.REGISTRY_PASSWORD_ALIYUN }}

      - name: Build Docker image (Dockerfile.corex)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: .beagle/corex.dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            registry.cn-qingdao.aliyuncs.com/wod/gpustack:v0.7.0-corex
          build-args: |
            BASE_IMAGE=ghcr.io/${{ github.repository }}:gpustack-v0.7.0-corex